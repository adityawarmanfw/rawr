name: Debug build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Explicit packages: the action's default list still names the removed
      # 'tools' package. Versions pinned in app/build.gradle.kts.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;29.0.14206865 cmake;3.31.6

      # native/image_scopes embeds its SPIR-V through `uv run`.
      - uses: astral-sh/setup-uv@v6

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # The shared debug key is a repository secret, so every CI debug APK has the same signature and installs
      # as an update over the last one. Without the secrets (pull requests from forks get none) the build falls
      # back to the runner's own debug key, which is different every run.
      - name: Assemble debug APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ] && [ -n "$DEBUG_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rawr-debug.jks"
            export RAWR_DEBUG_SIGNING_STORE_FILE="$RUNNER_TEMP/rawr-debug.jks"
            export RAWR_DEBUG_SIGNING_STORE_PASSWORD="$DEBUG_KEYSTORE_PASSWORD"
            export RAWR_DEBUG_SIGNING_KEY_ALIAS=rawrdebug
            export RAWR_DEBUG_SIGNING_KEY_PASSWORD="$DEBUG_KEYSTORE_PASSWORD"
            echo "::notice title=Debug signing::signed with the shared debug key"
          else
            echo "::warning title=Debug signing::no shared debug key available; this APK cannot update an earlier debug install"
          fi
          ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: rawr-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Merges to main republish the `debug` prerelease so its download link
      # stays stable. PRs only keep the run artifact.
      - name: Publish debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk rawr-debug.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug rawr-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Debug build of ${GITHUB_SHA::8}. Installs alongside release as Rawr Debug."

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
